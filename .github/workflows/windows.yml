name: Windows

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            host: x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-arm
            host: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          $toolchain = Get-Content rust-toolchain.toml -Raw
          $version = [regex]::Match($toolchain, '(?m)^channel\s*=\s*"(\d+\.\d+\.\d+)"\s*$')
          if (-not $version.Success) { throw 'rust-toolchain.toml must pin a complete Rust version.' }
          rustup toolchain install "$($version.Groups[1].Value)-${{ matrix.host }}" --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test release packaging
        run: .\scripts\test-build.ps1
      - name: Format, check, Clippy, test, and package release
        # The build script uses Cargo.lock throughout. Ignored CFAPI tests remain
        # opt-in because hosted runners may not permit Cloud Files registration.
        run: .\scripts\build.ps1 -Architecture ${{ matrix.architecture }}
      - name: Upload Windows release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bucket-mount-windows-${{ matrix.architecture }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    needs: windows
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bucket-mount-windows-*
          merge-multiple: true
          path: dist
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Publish setup and portable downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
